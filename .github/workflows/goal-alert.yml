name: Goal Alert

on:
  schedule:
    - cron: '* * * * *'  # every minute
  workflow_dispatch:      # allow manual trigger

jobs:
  check-goals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python main.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
